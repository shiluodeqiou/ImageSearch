[Global]
;自动更新索引，启用后将每小时自动更新一次
IndexAutoUpdate=true

;启动http服务，启动后可以调用HTTP API
RunServer=false
;Http服务端口号
HttpPort=5000

;监听地址：
;  127.0.0.1 —— 仅本机可访问（默认，安全）
;  0.0.0.0   —— 允许局域网内其他设备访问（必须同时设置 ApiToken，
;               否则程序会自动退回仅本机监听，避免无鉴权暴露）
HttpHost=127.0.0.1
;接口访问令牌。非空时，/search、/index 等接口必须在请求头
;X-Api-Key 或查询参数 api_key 中携带相同值才允许调用。
;仅本机使用（HttpHost=127.0.0.1）时可留空。
ApiToken=

;是否以管理员身份运行。
;默认 false：Windows 的权限隔离（UIPI）会阻止普通权限的资源管理器向提权窗口拖放文件，
;开启后「拖放图片/视频到窗口搜索」会完全失效（鼠标显示禁止符号、毫无反应），
;这是系统级限制，程序内无法绕过。
;实测磁盘介质识别（SSD/HDD 判定）**不需要**管理员权限，故默认已关闭；
;仅当你的索引目录/磁盘确实需要提权访问时才改为 true，此时请改用
;「选择图片」按钮或 Ctrl+V 粘贴作为输入方式。
RunAsAdmin=false

;视频抽帧用的 ffmpeg 路径。
;留空则按「程序目录 tools 子目录 → 程序目录 → 系统 PATH」顺序自动查找；
;内置版本已放在 tools/ffmpeg.exe，通常无需填写。
;若想用别的版本，可填绝对路径（如 D:/ffmpeg/bin/ffmpeg.exe）。
FFmpegPath=
